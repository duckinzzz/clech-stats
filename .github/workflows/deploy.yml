name: Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: duckinzzz
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha, mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Build and push nginx (frontend) image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          cache-from: type=gha
          cache-to: type=gha, mode=max
          tags: |
            ghcr.io/${{ github.repository }}-nginx:latest
            ghcr.io/${{ github.repository }}-nginx:${{ github.sha }}
      - name: Make image public
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          gh api -X PATCH /user/packages/container/${{ github.event.repository.name }}/visibility -f visibility=public
          gh api -X PATCH /user/packages/container/${{ github.event.repository.name }}-nginx/visibility -f visibility=public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 30m
          script: |
            cd /srv/clech-stats
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
